# Publish parleyvoo to npm on version tags
# — via npm Trusted
# Publishing (GitHub OIDC), so there are no tokens to store or rotate
# and no 2FA prompt: npm trusts this exact repo+workflow identity.
#
# One-time setup (after the package exists on npm):
#   npmjs.com → parleyvoo → Settings → Trusted Publisher →
#   GitHub Actions, repository jscholz/parley, workflow release.yml.
#
# Releasing:
#   npm version minor        # bumps package.json + creates the v* tag
#   git push origin master --tags
#
# --provenance additionally publishes a signed attestation linking the
# tarball to this commit + workflow run (shown on the npm package page).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Node 22 bundles npm 10.x, which does NOT support OIDC trusted
      # publishing (needs npm >= 11.5) — the publish step fails with an
      # auth error while everything else passes. First observed on the
      # v0.3.1 release run; same npm-10 limitation bit the manual
      # web-auth publish flow earlier the same day.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # prepack runs the client+server build, so the tarball ships build/
      - run: npm publish --provenance --access public
