[pytest]
# Neutralize pytest plugins that arrive from an ambient PYTHONPATH rather
# than this repo's environment.
#
# Galatea (the 2026-08-20 active host) is also a ROS 2 workstation: its
# ~/.bashrc sources /opt/ros/jazzy/setup.bash, which puts
# /opt/ros/jazzy/lib/python3.12/site-packages on PYTHONPATH for every
# interactive shell. pytest autoloads plugins by entry point, so ROS's
# seven pytest11 plugins loaded into this suite and either hooked log
# capture (8 spurious caplog-shaped failures, misread as "env drift" on
# 2026-08-23) or aborted collection outright when a ROS dependency was
# unresolvable (ModuleNotFoundError: lark).
#
# The suite needs no third-party pytest plugin — async tests drive their
# own loop via asyncio.run() — so blocking these is free. For pollution
# from some other toolchain, run with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
# instead of extending this list.
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_lint
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_pep257
    -p no:ament_xmllint
