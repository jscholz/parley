# Parley deployment config. Copy to `parley.config.yaml` (or
# anywhere; point at it via `PARLEY_CONFIG=/abs/path/.../parley.config.yaml`).
#
# Two halves:
#
#   1. Static deployment tuning — set once when you stand up the
#      install, requires a service restart to change.
#   2. Frontend-tunable seeds — chip-UI editors in Settings write
#      back to these keys. The proxy reloads the yaml on mtime
#      change, so live edits via the chip UI take effect without
#      a restart.
#
# Secrets (DEEPGRAM_API_KEY, OPENROUTER_API_KEY, PARLEY_PLATFORM_TOKEN)
# stay in `.env` — never in this file.

# ─────────────────────────────────────────────────────────────────────
# 1. STATIC DEPLOYMENT TUNING (restart required)
# ─────────────────────────────────────────────────────────────────────

# Branding — shown in the header, manifest, and lockscreen label.
app:
  name: Parley
  subtitle: Agent Portal
  agent_label: Clawdian
  # Optional override for the --primary CSS variable. Any CSS color
  # (hex / rgb() / hsl()). Empty/null = stylesheet default (sage).
  theme_primary: ~

# Backend/upstream agent. Parley speaks the abstract agent contract
# (see docs/ABSTRACT_AGENT_PROTOCOL.md); any compliant `/v1/*` server
# drops in. The token + URL go through env vars in production
# (PARLEY_PLATFORM_URL / PARLEY_PLATFORM_TOKEN).
backend:
  # Which upstream to run. 'http' (default) = any /v1 abstract-agent
  # server (hermes plugin, bundled stub). 'claude-code' = your local
  # Claude Code install via the Agent SDK, in-process (configure the
  # claude_code block below). Env override: PARLEY_BACKEND.
  name: http
  parley_platform:
    url: http://127.0.0.1:8645
    # token: read from $PARLEY_PLATFORM_TOKEN; never in this file.

# Claude Code backend (backend.name: claude-code). See
# backends/claude-code/README.md for the full contract. Approvals
# default to 'remote': tool-permission requests pop in the app (and on
# your phone) and the turn waits; 'auto' skips the round-trip and runs
# with permission_mode. Pending approvals are auto-denied when the turn
# ends/aborts, so an abandoned prompt can't hang the SDK. v1 degrades
# gracefully on unread/pins/activity (plugin-HTTP extras).
claude_code:
  cwd: ~                    # project dir chats pin to (required to enable)
  # cwd_allowlist: ['/home/me/code']
  # model: claude-sonnet-5  # omit = account default
  approvals: remote         # remote | auto
  # permission_mode: acceptEdits   # used when approvals: auto
  # persist_path: ~/.parley/claude-code-sessions.json
  # max_turns: 80

# HTTP server.
server:
  port: 3001
  host: ~                 # null = 127.0.0.1; '0.0.0.0' to bind all interfaces
  disable_screenshot: false  # set true to skip Playwright link-preview cards
  # Voice capture requires a browser secure context. For remote access,
  # run Parley over HTTPS by setting both files below, or use a
  # trusted reverse proxy such as Tailscale Serve / Caddy in front of
  # the local HTTP listener.
  https:
    cert_file: ~          # env override: PARLEY_HTTPS_CERT_FILE
    key_file: ~           # env override: PARLEY_HTTPS_KEY_FILE

# Ambient corner widget — leave null to use browser geolocation.
weather:
  lat: ~
  lon: ~

# ─────────────────────────────────────────────────────────────────────
# 2. FRONTEND-TUNABLE SEEDS (no restart; chip UI writes here)
# ─────────────────────────────────────────────────────────────────────

# Deepgram STT vocabulary biasing. Names, project codes, jargon — the
# stuff Deepgram would otherwise transcribe wrong. The PWA seeds each
# fresh user's IndexedDB list from here; existing users manage their
# own list via Settings → STT keyterms (chips). Edits to this list
# affect future first-launches only — they don't push to existing
# users' IDB.
stt:
  keyterms:
    - Parley
    - Deepgram
